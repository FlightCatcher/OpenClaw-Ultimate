
[project]
name = "openclaw-ultimate"
version = "1.0.4"
description = "VELA — verified, local-first AI agent operating system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "loguru>=0.7",
  "ollama>=0.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
ocu = "openclaw_ultimate.cli:app"
vela = "openclaw_ultimate.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_ultimate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
cache_dir = ".openclaw/mypy-cache"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
follow_imports = "skip"
